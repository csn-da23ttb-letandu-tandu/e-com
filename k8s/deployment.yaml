apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandu-web-deployment
  namespace: tgcn-prod
  labels:
    app: tandu-web
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tandu-web
  template:
    metadata:
      labels:
        app: tandu-web
    spec:
      containers:
      - name: tandu-web
        image: tandu5205/tandu-web:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tandu-web-service
  namespace: tgcn-prod
spec:
  type: ClusterIP
  selector:
    app: tandu-web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tandu-web-ingress
  namespace: tgcn-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - thegioicongnghe.id.vn
    secretName: tandu-web-tls
  rules:
  - host: thegioicongnghe.id.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tandu-web-service
            port:
              number: 80
